[build]
  command = "npx prisma generate && npx next build"

[build.environment]
  NODE_VERSION = "22"
  AUTH_TRUST_HOST = "true"

# School search reads the register from disk at runtime.
[functions]
  included_files = ["data/ug-schools.jsonl", "data/ug-schools.json", "data/fresh-teacher/inventory.json", "data/fresh-teacher/summary.json"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
